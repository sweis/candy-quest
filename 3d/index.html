<script>
window.CQ3D_BUILD='3d-0.2.1 · 2026-09-26';
window.addEventListener('error',function(e){try{var b=document.getElementById('cq-err')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'cq-err'}));b.textContent='Candy Quest 3D error ('+window.CQ3D_BUILD+'): '+(e.message||e.type)+(e.filename?' @'+e.filename.split('/').pop()+':'+e.lineno:'');}catch(_){}});

<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="tags"></div>
  <div id="hud" hidden></div>
  <div id="toasts"></div>

  <div id="panel"></div>
  <div id="diag" hidden></div>
  <div id="loading"><div class="spin"></div><div class="lt">Unwrapping the candy world…</div></div>
</div>
<div class="rotate-hint">🔄 Rotate your device to landscape to play</div>
